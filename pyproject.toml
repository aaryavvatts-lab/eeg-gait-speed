[project]
name = "gaitbci"
version = "0.1.0"
description = "Decoding walking speed from EEG and EMG during treadmill gait"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "mne>=1.8",
    "joblib>=1.4",
    "tqdm>=4.66",
    "pyarrow>=17.0",
    "markdown>=3.10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaitbci"]
